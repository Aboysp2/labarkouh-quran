<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a5e3a">
    <title>لا باركوه للقرآن الكريم</title>
    
    <style>
        :root {
            --primary: #1a5e3a;
            --primary-dark: #0d3d22;
            --secondary: #d4af37;
            --bg: #f5f0e1;
            --text: #2c2c2c;
            --card: #ffffff;
            --shadow: 0 4px 12px rgba(0,0,0,0.1);
            --radius: 12px;
        }

        body.dark-mode {
            --bg: #1a1a2e;
            --text: #f0f0f0;
            --card: #16213e;
            --shadow: 0 4px 12px rgba(0,0,0,0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 120px; transition: background 0.3s, color 0.3s; }

        .splash-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); display: flex; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s ease-out; }
        .splash-screen.hidden { opacity: 0; pointer-events: none; visibility: hidden; }
        .splash-content { text-align: center; color: white; display: flex; flex-direction: column; align-items: center; }
        .splash-logo { width: 100px; height: 100px; margin-bottom: 15px; }
        .splash-title { font-size: 2.2em; color: var(--secondary); margin-bottom: 5px; }
        .splash-subtitle { font-size: 1.1em; opacity: 0.9; margin-bottom: 20px; }
        .splash-loader { width: 35px; height: 35px; border: 4px solid rgba(255,255,255,0.3); border-top-color: var(--secondary); border-radius: 50%; animation: spin 1s linear infinite; }

        @keyframes spin { to { transform: rotate(360deg); } }

        .main-header { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); padding: 25px 15px; text-align: center; box-shadow: var(--shadow); border-bottom: 4px solid var(--secondary); }
        .site-title { color: #fff; font-size: 1.8em; margin-bottom: 5px; font-weight: bold; }
        .banner-text { color: var(--secondary); font-size: 1em; }

        .player-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); padding: 12px 20px; box-shadow: 0 -4px 15px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 15px; z-index: 1000; flex-wrap: wrap; border-top: 3px solid var(--secondary); }
        .player-info { flex: 1; min-width: 140px; }
        #currentSurahName { font-weight: bold; color: var(--primary); display: block; }
        #currentSheikhName { font-size: 0.8em; opacity: 0.7; display: block; }
        .player-controls { display: flex; gap: 8px; align-items: center; }
        .control-btn { background: var(--primary); color: white; border: none; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 1em; display: flex; align-items: center; justify-content: center; transition: transform 0.2s, background 0.2s; }
        .control-btn:hover { transform: scale(1.1); background: var(--primary-dark); }
        .play-btn { width: 48px; height: 48px; background: var(--secondary); color: var(--primary-dark); font-size: 1.3em; }
        .play-btn:hover { background: #e6c234; }
        .player-progress { flex: 2; display: flex; align-items: center; gap: 8px; min-width: 180px; font-size:; }
        #volumeBar { width: 70px; height: 6px; accent-color: var(--primary); cursor: pointer; }

        .main-nav { display: flex; justify-content: center; background: var(--card); padding: 10px; gap: 8px; box-shadow: var(--shadow); flex-wrap: wrap; }
        .nav-btn { background: transparent; border: 1.5px solid var(--primary); color: var(--primary); padding: 6px 14px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.9em; transition: all 0.3s; }
        .nav-btn.active, .nav-btn:hover { background: var(--primary); color: white; }

        .content { max-width: 900px; margin: 20px auto; padding: 0 15px; }
        .section { display: none; }
        .section.active { display: block; }
        .section-title { color: var(--primary); margin-bottom: 15px; border-bottom: 2px solid var(--secondary); padding-bottom: 5px; font-size: 1.3em; }

        .welcome-card { background: var(--card); padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); text-align: center; margin-bottom: 20px; border-top: 4px solid var(--primary); }
        .quick-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
        .stat-card { background: var(--card); padding: 12px; border-radius: var(--radius); text-align: center; box-shadow: var(--shadow); }

        .search-box input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: var(--radius); margin-bottom: 15px; background: var(--card); color: var(--text); outline: none; transition: border-color 0.3s; }
        .search-box input:focus { border-color: var(--primary); }
        .sheikhs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
        .sheikh-card { background: var(--card); padding: 12px; border-radius: var(--radius); box-shadow: var(--shadow); text-align: center; cursor: pointer; border: 1px solid rgba(0,0,0,0.05); transition: transform 0.2s, border-color 0.2s; }
        .sheikh-card:hover { transform: translateY(-3px); }
        .sheikh-card.selected { border: 2px solid var(--secondary); background: rgba(212, 175, 55, 0.1); }
        .country-tag { font-size: 0.75em; background: rgba(26,94,58,0.1); color: var(--primary); padding: 2px 8px; border-radius: 10px; margin-top: 4px; display: inline-block; }

        .surahs-list { display: flex; flex-direction: column; gap: 8px; }
        .surah-item { background: var(--card); padding: 12px 15px; border-radius: var(--radius); box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center; transition: transform 0.2s; }
        .surah-info { display: flex; gap: 12px; align-items: center; cursor: pointer; flex: 1; }
        .surah-num { background: var(--primary); color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.85em; font-weight: bold; }
        
        .action-btns { display: flex; gap: 8px; align-items: center; }
        .save-btn { background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 18px; font-size: 0.8em; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all 0.2s; }
        .save-btn:hover { background: var(--primary-dark); }
        .save-btn.saved { background: #27ae60; }
        .direct-download { background: var(--secondary); color: var(--primary-dark); text-decoration: none; padding: 6px 10px; border-radius: 18px; font-size: 0.8em; font-weight: bold; transition: transform 0.2s; display: inline-block; }
        .direct-download:hover { transform: scale(1.05); }

        .setting-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); }

        .main-footer { background: var(--primary-dark); color: white; text-align: center; padding: 15px; margin-top: 30px; font-size: 0.85em; }

        .no-results { text-align: center; padding: 20px; color: #666; }
    </style>
</head>
<body>

    <!-- شاشة البداية -->
    <div id="splashScreen" class="splash-screen">
        <div class="splash-content">
            <div id="splashLogoContainer" class="splash-logo"></div>
            <h1 class="splash-title">لا باركوه</h1>
            <p class="splash-subtitle">صدقة جارية لكل من ينشرها</p>
            <div class="splash-loader"></div>
        </div>
    </div>

    <!-- الهيدر -->
    <header class="main-header">
        <h1 class="site-title">لا باركوه للقرآن الكريم</h1>
        <p class="banner-text">صدقة جارية لكل من ينشرها</p>
    </header>

    <!-- مشغل الصوت -->
    <div class="player-bar" id="playerBar">
        <div class="player-info">
            <span id="currentSurahName">اختر سورة للاستماع</span>
            <span id="currentSheikhName"></span>
        </div>
        <div class="player-controls">
            <button id="prevBtn" class="control-btn" title="السورة السابقة">⏮</button>
            <button id="playBtn" class="control-btn play-btn" title="تشغيل/إيقاف">▶</button>
            <button id="nextBtn" class="control-btn" title="السورة التالية">⏭</button>
            <button id="stopBtn" class="control-btn" title="إيقاف">⏹</button>
        </div>
        <div class="player-progress">
            <span id="currentTime">00:00</span>
            <input type="range" id="progressBar" value="0" min="0" max="100">
            <span id="duration">00:00</span>
        </div>
        <div class="volume-control">
            <span>🔊</span>
            <input type="range" id="volumeBar" value="100" min="0" max="100">
        </div>
    </div>

    <!-- شريط التنقل -->
    <nav class="main-nav">
        <button class="nav-btn active" data-section="home">🏠 الرئيسية</button>
        <button class="nav-btn" data-section="sheikhs">👤 المشايخ</button>
        <button class="nav-btn" data-section="surahs">📖 السور</button>
        <button class="nav-btn" data-section="settings">⚙ الإعدادات</button>
    </nav>

    <!-- المحتوى -->
    <main class="content">
        <!-- قسم الرئيسية -->
        <section id="home" class="section active">
            <div class="welcome-card">
                <h2>🕌 مرحباً بك في تطبيق لا باركوه</h2>
                <p>استمع واحفظ تلاوات القرآن الكريم بسهولة</p>
            </div>
            <div class="quick-stats">
                <div class="stat-card
